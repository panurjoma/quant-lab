<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Quant Lab — learn, research, backtest and trade</title>
<desc id="desc">A dark quantitative finance laboratory with market charts, mathematical signals, bull and bear forms, and the progression from learning to controlled trading.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06121f"/><stop offset=".55" stop-color="#0b2138"/><stop offset="1" stop-color="#071019"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#43b8ff"/><stop offset="1" stop-color="#1967d2"/></linearGradient>
 <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ffb14a"/><stop offset="1" stop-color="#ff5722"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#5aa9e6" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1600" height="620" rx="24" fill="url(#bg)"/><rect width="1600" height="620" rx="24" fill="url(#grid)"/>
<g opacity=".25" stroke="#6fbef0"><path d="M0 500H1600"/><path d="M0 420H1600"/><path d="M0 340H1600"/></g>
