<g font-family="Inter,Segoe UI,Arial,sans-serif">
<rect x="92" y="475" width="260" height="92" rx="14" fill="#0b1c2c" stroke="#2f88c8"/><text x="116" y="510" fill="#8fcfff" font-size="18">LEARN</text><text x="116" y="542" fill="#fff" font-size="20">rₜ = ln(Pₜ / Pₜ₋₁)</text>
<rect x="375" y="475" width="260" height="92" rx="14" fill="#0b1c2c" stroke="#2f88c8"/><text x="399" y="510" fill="#8fcfff" font-size="18">RESEARCH</text><text x="399" y="542" fill="#fff" font-size="20">hypothesis → experiment</text>
<rect x="658" y="475" width="260" height="92" rx="14" fill="#0b1c2c" stroke="#2f88c8"/><text x="682" y="510" fill="#8fcfff" font-size="18">BACKTEST</text><text x="682" y="542" fill="#fff" font-size="20">costs · risk · validation</text>
