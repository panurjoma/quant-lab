<g transform="translate(90 68)"><path d="M0 76L48 15l35 43 35-58 72 76h-38l-33-36-35 57-36-43-24 22z" fill="none" stroke="url(#blue)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
<g stroke="#49baff" stroke-width="5"><path d="M63 40v46"/><rect x="55" y="54" width="16" height="20" fill="#49baff"/><path d="M92 31v61"/><rect x="84" y="44" width="16" height="27" fill="#49baff"/><path d="M120 27v58"/><rect x="112" y="48" width="16" height="22" fill="#49baff"/></g></g>
<text x="320" y="122" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" fill="#f4f8fc">Quant <tspan fill="#45aef5">Lab</tspan></text>
<text x="325" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#9db4c9" letter-spacing="3">LEARN  ·  RESEARCH  ·  BACKTEST  ·  TRADE</text>
<text x="325" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#d0dce7">From quantitative ideas to reproducible, controlled trading systems.</text>
